spring.application.name=MiniTrello-backend

# --- Conexiunea la DB (containerul Docker, portul 5433 de pe Mac!) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/minitrello
spring.datasource.username=minitrello
spring.datasource.password=minitrello

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
